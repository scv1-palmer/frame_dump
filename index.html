<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FrameSender - Resize & Share Photos</title>
    <!-- Tailwind CSS for clean, responsive mobile styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 shadow-md text-center">
        <h1 class="text-xl font-bold">🖼️ FrameSender</h1>
        <p class="text-xs text-blue-100">Shrink & batch photos for digital frames</p>
    </header>

    <!-- Main Content -->
    <main class="max-w-md mx-auto p-4 w-full flex-grow flex flex-col justify-center">
        
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 space-y-4">
            <div>
                <label class="block font-semibold text-sm mb-1 text-gray-700">1. Select Photos</label>
                <input type="file" id="photoInput" multiple accept="image/*" 
                    class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
            </div>

            <div>
                <label class="block font-semibold text-sm mb-1 text-gray-700">2. Frame Screen Quality</label>
                <select id="qualitySelect" class="w-full p-2.5 border border-gray-300 rounded-lg text-sm bg-white">
                    <option value="1920">Standard HD Frame (1920px - Recommended)</option>
                    <option value="1200">Smaller / Older Frame (1200px)</option>
                    <option value="2560">High-Res 2K Frame</option>
                </select>
            </div>

            <div id="statusArea" class="hidden text-sm text-center text-blue-600 font-medium py-2">
                Processing photos... <span id="progressText">0%</span>
            </div>

            <button id="processBtn" onclick="processAndShare()" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-xl shadow transition duration-200 text-center">
                Resize & Share to Email
            </button>
        </div>

        <div class="mt-6 text-xs text-gray-500 space-y-2 text-center">
            <p>💡 Photos are shrunk right on your phone so they easily pass email size limits without bouncing.</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center p-4 text-xs text-gray-400">
        Secure & Private — Processing happens locally on your device.
    </footer>

    <!-- Script Logic -->
    <script>
        async function processAndShare() {
            const fileInput = document.getElementById('photoInput');
            const targetDim = parseInt(document.getElementById('qualitySelect').value);
            const statusArea = document.getElementById('statusArea');
            const progressText = document.getElementById('progressText');
            const processBtn = document.getElementById('processBtn');

            if (!fileInput.files.length) {
                alert('Please select at least one photo first.');
                return;
            }

            statusArea.classList.remove('hidden');
            processBtn.disabled = true;
            processBtn.classList.add('opacity-50');

            const files = Array.from(fileInput.files);
            const processedFiles = [];

            for (let i = 0; i < files.length; i++) {
                progressText.innerText = `${Math.round(((i + 1) / files.length) * 100)}%`;
                const compressedBlob = await resizeImage(files[i], targetDim);
                const safeName = files[i].name.replace(/\.[^/.]+$/, "") + ".jpg";
                processedFiles.push(new File([compressedBlob], safeName, { type: 'image/jpeg' }));
            }

            statusArea.classList.add('hidden');
            processBtn.disabled = false;
            processBtn.classList.remove('opacity-50');

            // Check if mobile browser supports native file sharing
            if (navigator.canShare && navigator.canShare({ files: processedFiles })) {
                try {
                    await navigator.share({
                        title: 'Photos for Digital Frame',
                        text: 'Here are the resized photos for the frame!',
                        files: processedFiles,
                    });
                } catch (error) {
                    if (error.name !== 'AbortError') {
                        console.error('Sharing failed', error);
                        fallbackDownload(processedFiles);
                    }
                }
            } else {
                // Fallback for browsers that don't support file sharing API
                alert('Your browser does not support direct email handoff. We will download the resized files instead.');
                fallbackDownload(processedFiles);
            }
        }

        // Resizing algorithm using HTML Canvas
        function resizeImage(file, maxDim) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > maxDim) {
                                height = Math.round((height * maxDim) / width);
                                width = maxDim;
                            }
                        } else {
                            if (height > maxDim) {
                                width = Math.round((width * maxDim) / height);
                                height = maxDim;
                            }
                        }

                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        canvas.toBlob((blob) => {
                            resolve(blob);
                        }, 'image/jpeg', 0.85); // 85% JPEG quality gives optimal file size/clarity balance
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        // Fallback helper if share sheet isn't supported
        function fallbackDownload(files) {
            files.forEach((file, index) => {
                const url = URL.createObjectURL(file);
                const a = document.createElement('a');
                a.href = url;
                a.download = file.name;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            });
        }
    </script>
</body>
</html>
